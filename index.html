function segMin(i, speed) { if (i === DATA.taxiSeg && state.taxi) return 120; return segKm(i) / speed * 60; }

function compute(useActuals) {
  const S = state.settings, rows = [], days = [];
  let d = 0, day = state.days[0], dep = toMin(day.start), dayKm = 0, cum = 0, firstOfDay = true;
  const dayTotal = state.days.map((dd, k) => {
    const from = k === 0 ? 0 : state.days[k - 1].end + 1; let t = 0;
    for (let i = from; i <= dd.end; i++) t += segKm(i);
    const prev = k > 0 ? state.days[k - 1].lodging.km || 0 : 0;
    return t + prev + (dd.lodging.km || 0);
  });
  for (let i = 0; i <= LAST; i++) {
    let km = segKm(i), min = segMin(i, S.speed);
    if (firstOfDay && d > 0) { const lk = state.days[d - 1].lodging.km || 0; km += lk; min += lk / S.speed * 60; }
    const plan = i === 0 ? dep : dep + min;
    let arr = plan;
    if (useActuals && state.actuals[i] != null) arr = toMin(state.actuals[i]);
    cum += km; dayKm += km;
    const cert = DATA.cert.includes(i);
    let out = arr;
    const row = { type: 'stop', i, d, arr, plan, km, cum, dayKm, remain: dayTotal[d] - dayKm, cert, taxi: i === DATA.taxiSeg && state.taxi, actual: state.actuals[i] || null };
    rows.push(row);
    if (cert) for (const k of ['cert', 'rest']) { const m = k === 'cert' ? certMin(i) : restMin(i); if (m > 0) { rows.push({ type: 'item', it: { id: k + '-' + i, builtin: true, after: i, type: k, min: m, label: k === 'cert' ? '인증' : '휴식' }, d, start: out, end: out + m }); out += m; } }
    for (const it of itemsAfter(i)) { rows.push({ type: 'item', it, d, start: out, end: out + it.min }); out += it.min; }
    row.out = out;
    if (i === day.end) {
      const L = day.lodging; let endTime = out;
      if (L && (L.km > 0 || L.name)) { endTime = out + (L.km || 0) / S.speed * 60; rows.push({ type: 'lodging', d, arr: endTime, name: L.name, km: L.km || 0 }); }
      days.push({ d, total: dayTotal[d], endTime, start: day.start });
      rows.push({ type: 'dayend', d });
      if (i < LAST) { d++; day = state.days[d]; dep = toMin(day.start); dayKm = 0; firstOfDay = true; }
    } else { dep = out; firstOfDay = false; }
  }
  return { rows, days, cum };
}

function profileSvg(seg) {
  const P = seg.profile; if (!P || P.length < 2) return '';
  const W = 300, H = 56, top = Math.max(seg.maxEle, 10) * 1.12, x1 = P[P.length - 1][0] || 1;
  const px = x => x / x1 * W, py = y => H - 2 - y / top * (H - 10);
  const pts = P.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join(' ');
  const mi = P.reduce((b, p, k) => p[1] > P[b][1] ? k : b, 0);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="고도"><polygon fill="var(--fill)" points="0,${H} ${pts} ${W},${H}"/><polyline fill="none" stroke="var(--stroke)" stroke-width="1.5" points="${pts}"/><circle cx="${px(P[mi][0]).toFixed(1)}" cy="${py(P[mi][1]).toFixed(1)}" r="2.5" fill="var(--blue)"/><text x="${Math.min(px(P[mi][0]) + 5, W - 40).toFixed(1)}" y="${(py(P[mi][1]) + 10).toFixed(1)}" font-size="10" fill="var(--blue)">${seg.maxEle}m</text></svg>`;
}

  else if (act === 'recnow') { snapshot(`${DATA.stops[i]} ${nowStr()} 기록`); state.actuals[i] = nowStr(); ui.timeEdit = null; }
  else if (act === 'recinput') { ui.timeInput = true; }
  else if (act === 'recsave') { const v = $(`[data-recin="${i}"]`).value; if (v) { snapshot(`${DATA.stops[i]} ${v} 기록`); state.actuals[i] = v; } ui.timeEdit = null; ui.timeInput = false; }
  else if (act === 'recclear') { snapshot(`${DATA.stops[i]} 기록 삭제`); delete state.actuals[i]; ui.timeEdit = null; }
  else if (act === 'insert') { const q = t.dataset.quick; ui.timeEdit = null; if (q) { addItem(i, q); } else ui.insertAfter = ui.insertAfter === i ? null : i; }
  else if (act === 'insclose') { ui.insertAfter = null; }
  else if (act === 'additem') { const type = t.dataset.type; let label, min; if (type === 'etc') { label = ($('[data-etcname]').value || '기타').trim(); min = Number($('[data-etcmin]').value) || 15; } addItem(i, type, label, min); ui.insertAfter = null; }
  else if (act === 'delitem') { const id = t.dataset.id, m = id.match(/^(cert|rest)-(\d+)$/); if (m) { const si = Number(m[2]); snapshot(`${DATA.stops[si]} ${m[1] === 'cert' ? '인증' : '휴식'} 제거`); state.adj[si] = { ...adjOf(si), [m[1]]: 0 }; } else { const it = state.items.find(x => x.id === id); snapshot(`${it.label} ${it.min}분 삭제`); state.items = state.items.filter(x => x.id !== id); } }
  else if (act === 'restore') { const si = Number(t.dataset.i), k = t.dataset.k; snapshot(`${DATA.stops[si]} ${k === 'cert' ? '인증' : '휴식'} 복원`); const a = { ...adjOf(si) }; delete a[k]; state.adj[si] = a; ui.insertAfter = null; }
  else if (act === 'edititem') { ui.editItem = t.dataset.id; }
  else if (act === 'taxi' || act === 'theme') { return; }
  else if (act === 'taxitoggle') { snapshot(state.taxi ? '자전거 구간으로 전환' : '택시로 전환'); state.taxi = !state.taxi; }
  else if (act === 'daystart') { ui.dayStart = ui.dayStart === Number(t.dataset.d) ? null : Number(t.dataset.d); }
  else if (act === 'addlodging') { state.days[Number(t.dataset.d)].lodging = { name: '숙소', km: 1 }; }
  else if (act === 'addday') { const n = state.days.length, prev = state.days[n - 1]; if (prev.end - (n > 1 ? state.days[n - 2].end : -1) < 2) return; prev.end = LAST - 1; const dt = new Date(prev.date + 'T00:00:00'); dt.setDate(dt.getDate() + 1); state.days.push({ date: `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`, start: '06:30', end: LAST, lodging: { name: '', km: 0 } }); }
  else if (act === 'reset') { if (!ui.resetArmed) { ui.resetArmed = true; setTimeout(() => { ui.resetArmed = false; render(); }, 3000); } else { state = defaultState(); ui.resetArmed = false; ui.panel = null; } }
  render();
});
function addItem(after, type, label, min) {
  const S = state.settings; const d = TYPES[type];
  label = label || d[0]; min = min || (d[1] ? S[d[1]] : 15);
  snapshot(`${label} ${min}분 삽입`);
  state.items.push({ id: 'it' + (uid++), after, type, label, min });
}
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.set) { const v = Number(el.value); if (v >= 0) state.settings[el.dataset.set] = v; }
  else if (el.dataset.act === 'taxi') { state.taxi = el.value === '1'; }
  else if (el.dataset.act === 'theme') { state.theme = el.value; }
  else if (el.dataset.dayin != null) { state.days[Number(el.dataset.dayin)].start = el.value || '06:30'; ui.dayStart = null; }
  else if (el.dataset.lodname != null) { state.days[Number(el.dataset.lodname)].lodging.name = el.value; }
  else if (el.dataset.lodkm != null) { state.days[Number(el.dataset.lodkm)].lodging.km = Math.max(0, Number(el.value) || 0); }
  else if (el.dataset.itemmin != null) { const id = el.dataset.itemmin, m = id.match(/^(cert|rest)-(\d+)$/), v = Math.max(0, Number(el.value) || 0); if (m) { const si = Number(m[2]); state.adj[si] = { ...adjOf(si), [m[1]]: v }; } else { const it = state.items.find(x => x.id === id); if (it) it.min = v; } ui.editItem = null; }
  else return;
  render();
});

/* long-press drag: move stops between days, move items between stops */
const ghost = $('#ghost');
let press = null, drag = null, autoScroll = 0;
document.addEventListener('pointerdown', e => {
  const row = e.target.closest('[data-row="stop"],[data-row="item"]');
  if (!row || row.dataset.builtin || e.target.closest('button,input,select,[data-act]')) return;
  if (e.target.closest('.hdl')) { e.preventDefault(); startDrag(row, e); return; }
  press = { row, x: e.clientX, y: e.clientY, timer: setTimeout(() => startDrag(row, e), 350) };
});
function cancelPress() { if (press) { clearTimeout(press.timer); press = null; } }
function startDrag(row, e) {
  press = null;
  drag = { kind: row.dataset.row, i: Number(row.dataset.i), id: row.dataset.id, fromDay: Number(row.dataset.day), target: null, before: false };
  row.classList.add('lift'); document.body.classList.add('dragging');
  ghost.textContent = row.dataset.row === 'stop' ? DATA.stops[drag.i] : (state.items.find(x => x.id === drag.id) || {}).label;
  ghost.style.display = 'block'; moveGhost(e.clientY);
  if (navigator.vibrate) navigator.vibrate(30);
}
function moveGhost(y) { ghost.style.top = (y - 20) + 'px'; }
document.addEventListener('pointermove', e => {
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) cancelPress();
  if (!drag) return;
  moveGhost(e.clientY);
  document.querySelectorAll('.over,.over-up').forEach(el => el.classList.remove('over', 'over-up'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tr = el && el.closest('[data-row],.dayh');
  drag.target = tr || null;
  if (tr) { const r = tr.getBoundingClientRect(); drag.before = e.clientY < r.top + r.height / 2; tr.classList.add(drag.before ? 'over-up' : 'over'); }
  const vh = window.innerHeight; autoScroll = e.clientY < 70 ? -8 : e.clientY > vh - 70 ? 8 : 0;
});
(function loop() { if (drag && autoScroll) window.scrollBy(0, autoScroll); requestAnimationFrame(loop); })();
document.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, e => {
  cancelPress();
  if (!drag) return;
  const d = drag; drag = null; autoScroll = 0;
  ghost.style.display = 'none'; document.body.classList.remove('dragging');
  document.querySelectorAll('.lift,.over,.over-up').forEach(el => el.classList.remove('lift', 'over', 'over-up'));
  if (!d.target) return;
  const tDay = Number(d.target.dataset.day);
  if (d.kind === 'stop') {
    if (isNaN(tDay) || tDay === d.fromDay) return;
    const i = d.i;
    if (tDay < d.fromDay) { if (i === 0) return; snapshot(`${DATA.stops[i]} → ${tDay + 1}일차로`); for (let k = tDay; k < d.fromDay; k++) state.days[k].end = i; }
    else { if (i === LAST) return; snapshot(`${DATA.stops[i]} → ${d.fromDay + 2}일차로`); for (let k = d.fromDay; k < tDay; k++) state.days[k].end = i - 1; }
  } else {
    const it = state.items.find(x => x.id === d.id); if (!it) return;
    let after;
    if (d.target.dataset.row === 'stop') after = Number(d.target.dataset.i) - (d.before ? 1 : 0);
    else if (d.target.dataset.row === 'item') { const o = state.items.find(x => x.id === d.target.dataset.id); after = o ? o.after : it.after; }
    else if (d.target.dataset.row === 'lodging' || d.target.dataset.row === 'dayend') after = state.days[tDay].end;
    else if (d.target.classList.contains('dayh')) after = tDay > 0 ? state.days[tDay - 1].end : 0;
    if (after == null || after < 0) return;
    snapshot(`${it.label} 이동`);
    state.items = state.items.filter(x => x.id !== it.id); it.after = after; state.items.push(it);
  }
  render();
}));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-row]')) e.preventDefault(); });

render();
})();
</script>
